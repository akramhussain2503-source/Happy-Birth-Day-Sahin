<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday ❤️</title>

    <style>
        body {
            text-align: center;
            background: #ffe6f2;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        h1 {
            color: #ff0066;
            font-size: 32px;
        }

        .pic {
            width: 260px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #message {
            font-size: 18px;
            margin: 20px auto;
            width: 85%;
            color: #444;
        }

        button {
            padding: 12px 24px;
            border: none;
            background: #ff4d79;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1 id="title">Happy Birthday, My Love ❤️</h1>

    <img id="photo" class="pic"
         src="SANA (1).jpeg">

    <p id="message">
        Wishing you the happiest birthday! You mean everything to me. ❤️
    </p>

    <button id="play">Play Song 🎵</button>

    <audio id="music"
        src="AA.mp3">
    </audio>

    <script>
        // ⭐ CHANGE THESE ONLY ⭐
        const gfName = "SAHINA ZAMAN";
        const message = "Happy Birthday to the person who makes my world infinitely brighter just by being in it. Being with you has shown me what true happiness feels like—it’s in our quiet moments, our endless laughs, and the way you understand me without me even saying a word. Thank you for being my safe place, my biggest supporter, and my favorite person. I hope this year brings you as much joy, warmth, and love as you bring into my life every single day. I love you more than words could ever capture.I LOVE YOU SAHIN❤️💖 ";
        const songURL = "AA.mp3";

        // Apply changes
        document.getElementById("title").textContent =
            `Happy Birthday, ${gfName} ❤️`;

        document.getElementById("message").textContent = message;
        document.getElementById("music").src = songURL;

        // ⭐ SIMPLE SLIDESHOW ⭐
        const photos = [
            "SANA (1).jpeg",
            "SANA (11).jpg",
            "SANA (2).jpg",
            "SANA (12).jpeg",
            "SANA (3).jpeg",
            "SANA (13).jpg",
            "SANA (4).jpeg",
            "SANA (14).jpg",
            "SANA (5).jpeg",
            "SANA (15).jpg",
            "SANA (6).jpeg",
            "SANA (16).jpg",
            "SANA (7).jpeg",
            "SANA (17).jpg",
            "SANA (8).jpeg",
            "SANA (18).jpg",
            "SANA (9).jpeg",
            "SANA (19).jpg",
            "SANA (10).jpg"
        ];

        let index = 0;

        setInterval(() => {
            index = (index + 1) % photos.length;
            document.getElementById("photo").src = photos[index];
        }, 2000); // changes every 2 seconds

        // Play button
        const music = document.getElementById("music");
        const btn = document.getElementById("play");

        btn.onclick = () => {
            music.play();
            btn.textContent = "Playing... 🎶";
        };
    </script>

</body>
</html>
